name: Build Abby Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate modern Flutter Android skeleton
        run: |
          flutter create --org com.example --platforms android abby_clean
          cp -r abby_clean/android mobile/
          cp mobile/AndroidManifest_custom.xml mobile/android/app/src/main/AndroidManifest.xml
          rm -rf abby_clean

      - name: Configure Android SDK and Kotlin versions
        working-directory: mobile/android
        run: |
          # Actualizar Kotlin a 2.0.0 y compileSdk a 34
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.0"/' settings.gradle || true
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.0"/' build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 24/g' app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' app/build.gradle

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abby-Android-MotoG05-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
