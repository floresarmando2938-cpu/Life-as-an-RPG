name: Build Abby Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate clean Flutter Android skeleton
        run: |
          # Crear esqueleto limpio con flutter create
          flutter create --org com.example --platforms android abby_clean
          # Copiar la estructura nativa completa preservando el código Dart y el manifest
          cp -r abby_clean/android mobile/
          # Sobreescribir con nuestro AndroidManifest personalizado para servicios y micrófono
          cp mobile/AndroidManifest_custom.xml mobile/android/app/src/main/AndroidManifest.xml
          rm -rf abby_clean

      - name: Configure Android Gradle Settings
        working-directory: mobile/android/app
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 24/g' build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' build.gradle

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart Code
        working-directory: mobile
        run: flutter analyze || true

      - name: Build APK (Release)
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abby-Android-MotoG05-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
