name: Build Abby Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Setup Full Android Flutter Template
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.example --platforms android abby
          cd ..
          # Copiar la estructura nativa completa de Android al directorio mobile
          cp -r temp_app/abby/android/* mobile/android/ || true
          rm -rf temp_app

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Adjust Android SDK min & compile versions
        working-directory: mobile/android/app
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 24/g' build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' build.gradle || true

      - name: Build APK (Release)
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abby-Android-MotoG05-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
