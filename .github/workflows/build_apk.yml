name: Build Abby Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Wrapper if missing
        working-directory: mobile
        run: |
          if [ ! -f "android/build.gradle" ]; then
            echo "Inicializando wrapper de Flutter Android..."
            flutter create . --platforms=android --org=com.example --project-name=abby
          fi

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abby-Android-MotoG05-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
